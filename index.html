function getAtt(id) { const a = SAVE.att[id] || []; const o = []; for (let i = 0; i < 7; i++) o[i] = a[i] || 0; return o; }
function stat(id, upg) {
  const w = WEAPONS[id], a = getAtt(id);
  const m = { dmg: 1, rpm: 1, mag: 1, reload: 1, spread: 1, recoil: 1, range: 1, mob: 1, hs: 1, burn: 0, silent: 0 };

    for (const k in o.m) { if (k === 'zoom') zoom = Math.max(zoom, o.m[k]); else if (k === 'burn' || k === 'silent') m[k] = 1; else m[k] *= o.m[k]; }
  });
  if (upg) { m.dmg *= 1.6; m.mag *= 1.5; m.spread *= .85; }
  const camo = CAMOS[a[6]][1];

/* =====================  الصوت  ===================== */
let AC = null, MG = null, NB = null;
function ensureAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = SAVE.set.vol; MG.connect(AC.destination);
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function aok() { return AC && AC.state === 'running'; }
function noise(dur, freq, q, vol, type) {
  if (!aok()) return; const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t, Math.random() * 0.5); s.stop(t + dur);
}
function tone(f, dur, type, vol, f2) {
  if (!aok()) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(MG); o.start(t); o.stop(t + dur);
}
const SHOT = [[0.07, 1800, 0.35], [0.05, 2400, 0.28], [0.08, 1200, 0.38], [0.2, 600, 0.55], [0.09, 900, 0.42], [0.3, 500, 0.6], [0.12, 1000, 0.45], [0.18, 700, 0.5]];

  boom() { noise(0.7, 260, 0.5, 0.8, 'lowpass'); tone(90, 0.6, 'sawtooth', 0.5, 30); },

function rumble(ms, s, w) {
  if (!SAVE.set.vib) return;

/* =====================  الصور والنسيج (تُرسم برمجياً)  ===================== */
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function shade(hex, v) { const n = parseInt(hex.slice(1), 16); return `rgb(${clamp((n >> 16) + v, 0, 255)},${clamp(((n >> 8) & 255) + v, 0, 255)},${clamp((n & 255) + v, 0, 255)})`; }
function grain(g, w, h, a) { for (let i = 0; i < w * h * 0.2; i++) { g.fillStyle = Math.random() < .5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a * .6})`; g.fillRect(rint(0, w - 1), rint(0, h - 1), 1, 1); } }
function texBrick(base, mortar) {
  const c = mkc(64, 64), g = c.getContext('2d'); g.fillStyle = mortar; g.fillRect(0, 0, 64, 64);
  for (let r = 0; r < 8; r++) { const off = (r % 2) * 8; for (let x = -8 + off; x < 64; x += 16) { g.fillStyle = shade(base, rint(-16, 16)); g.fillRect(x + 1, r * 8 + 1, 14, 6); } }
  grain(g, 64, 64, .18); return c;
}
function texConcrete() {
  const c = mkc(64, 64), g = c.getContext('2d'); g.fillStyle = '#6d6f73'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#55585c'; g.fillRect(0, 0, 2, 64); g.fillRect(31, 0, 2, 64); g.fillRect(0, 31, 64, 2);
  for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(30,30,30,${rnd(.05, .18)})`; g.fillRect(rint(0, 50), rint(0, 50), rint(8, 22), rint(8, 30)); }
  grain(g, 64, 64, .15); return c;
}
function texMetal() {
  const c = mkc(64, 64), g = c.getContext('2d'); g.fillStyle = '#46515c'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#3a444e'; g.fillRect(0, 0, 64, 3); g.fillRect(0, 61, 64, 3); g.fillRect(31, 0, 2, 64);
  g.fillStyle = '#6a7783'; [[4, 4], [58, 4], [4, 58], [58, 58], [27, 4], [36, 4]].forEach(([x, y]) => g.fillRect(x, y, 2, 2));
  g.fillStyle = 'rgba(180,70,30,.18)'; g.fillRect(rint(6, 40), rint(8, 40), 14, 22);
  grain(g, 64, 64, .14); return c;
}
function texDoor(i) {
